name: Deploy SIGAP PMII FEBI
on:
  # The repository's GitHub Pages managed workflow publishes every push to main.
  # Keep this diagnostic/manual workflow separate to avoid two deploy jobs
  # competing for the same "pages" concurrency group and environment.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
